[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-organizer"
version = "1.0.0"
description = "Local Python API for intelligent image text analysis using OCR, semantic parsing, and AI-ready prompt generation."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "pramozdev"}
]
keywords = ["ocr", "tesseract", "fastapi", "computer-vision", "text-extraction", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pytesseract==0.3.13",
    "opencv-python==4.13.0.92",
    "Pillow==12.2.0",
    "numpy==2.4.6",
    "loguru==0.7.3",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
ocr-analyze = "cli_analyze:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
